# Teaching page. Source: CV (March 2026).
intro: >-
  The enthusiasm, patience, and dedication of my teachers and professors has shaped
  the course of my life, and I truly hope to continue in their spirit. As a graduate
  student, I have taught courses across acoustics, robotics, machine learning, and
  mathematics, earning a Certificate of Distinction in Teaching award four times from
  the Harvard Derek Bok Center. I have since taught bioacoustics modules at both
  Cornell University and beyond.

workshop:
  title: Advanced Bioacoustics Workshop
  where: IISER Tirupati, India
  when: February 2–7, 2026
  term: Winter 2026
  photo: /images/teaching/iiser-workshop-2026.jpg
  photo_alt: Workshop participants and instructors gathered around the Advanced Bioacoustics Workshop 2026 banner at IISER Tirupati
  description: >-
    A week-long, hands-on workshop for 20 students and working professionals from
    across India, organized by IISER Tirupati and the K. Lisa Yang Center for
    Conservation Bioacoustics. I taught modules on unsupervised machine learning and
    acoustic localization.
  instructors: >-
    Co-taught with Rebecca Cohen, Spencer Keyser, and Meghan A. Beatty of the Yang
    Center, and V.V. Robin, Isha Bopardikar, and Chiti Arvind of IISER Tirupati.
  materials: https://github.com/skeyser/IISER_YC_AdvancedBioacoustics

